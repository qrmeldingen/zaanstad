<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Statistieken</title>
<style>
  body { font-family: sans-serif; max-width: 800px; margin: 2em auto; padding: 0 1em; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.5em; border-bottom: 1px solid #ddd; }
  th { background: #f5f5f5; }
  .loading { text-align: center; padding: 2em; color: #888; }
</style>
</head>
<body>
<h1>QR Statistieken</h1>
<div id="content" class="loading">Laden...</div>
<script>
async function loadStats() {
  try {
    const binsRes = await fetch("bins.json?_=" + Date.now());
    const bins = await binsRes.json();
    const entries = Object.entries(bins);

    const rows = await Promise.all(entries.map(async ([uuid, bin]) => {
      try {
        const res = await fetch(`https://countapi.mileshilliard.com/api/v1/get/zaanstad_${uuid}`);
        const data = await res.json();
        return { uuid, ...bin, count: data.value ?? 0 };
      } catch {
        return { uuid, ...bin, count: 0 };
      }
    }));

    let html = `<table>
      <tr><th>Omschrijving</th><th>UUID</th><th>Coördinaten</th><th>Scans</th></tr>`;
    for (const r of rows) {
      html += `<tr>
        <td>${r.text}</td>
        <td><code>${r.uuid}</code></td>
        <td>${r.lat}, ${r.lng}</td>
        <td><strong>${r.count}</strong></td>
      </tr>`;
    }
    html += `</table>`;
    document.getElementById("content").innerHTML = html;
  } catch (e) {
    document.getElementById("content").innerHTML = `<p class="loading">Fout: ${e.message}</p>`;
  }
}
loadStats();
</script>
</body>
</html>
